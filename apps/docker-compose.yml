version: '3.8'

services:
  # Post Service
  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: bloghub-post-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
    networks:
      - bloghub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Comment Service
  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    container_name: bloghub-comment-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=development
      - POST_SERVICE_URL=http://post-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
    networks:
      - bloghub-network
    depends_on:
      - post-service
      - notification-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: bloghub-user-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=development
      - JWT_SECRET=your-secret-key-change-in-production
    networks:
      - bloghub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Notification Service
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: bloghub-notification-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=development
    networks:
      - bloghub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bloghub-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_POST_SERVICE_URL=http://localhost:3001
      - VITE_COMMENT_SERVICE_URL=http://localhost:3002
      - VITE_USER_SERVICE_URL=http://localhost:3003
      - VITE_NOTIFICATION_SERVICE_URL=http://localhost:3004
    networks:
      - bloghub-network
    depends_on:
      - post-service
      - comment-service
      - user-service
      - notification-service
    restart: unless-stopped

networks:
  bloghub-network:
    driver: bridge

