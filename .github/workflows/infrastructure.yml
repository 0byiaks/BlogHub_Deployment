name: Infrastructure Deployment

# Concurrency control - prevents multiple runs
concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

# Permissions for OIDC authentication
permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required for checkout

on:
  # Trigger on push to develop (staging) or main (production) branches
  push:
    branches:
      - develop  # → staging environment
      - main     # → production environment
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infrastructure.yml'
  
  # Trigger on pull requests for review
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infrastructure.yml'
  
  # Allow manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
          - unlock
      lock_id:
        description: 'Lock ID to unlock (only needed for unlock action)'
        required: false
        type: string

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TERRAFORM_VERSION: 1.6.0

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      terraform_dir: ${{ steps.set-env.outputs.terraform_dir }}
    steps:
      - name: Set environment based on branch or input
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
          else
            ENV="staging"
          fi
          
          ROLE_ARN="arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role"
          
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "terraform_dir=infra/terraform/environments/${ENV}" >> $GITHUB_OUTPUT
          
          echo "✅ Role ARN will be: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role"
          
          echo "✅ Deploying to: ${ENV}"
          echo "📁 Terraform directory: infra/terraform/environments/${ENV}"
          echo "🔐 IAM Role ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role"
          echo "📦 Repository: ${{ github.repository }}"
          echo ""
          echo "⚠️ OIDC Trust Policy should match: repo:${{ github.repository }}:*"

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: determine-environment
    timeout-minutes: 30
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
          role-duration-seconds: 3600
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init
      
      - name: Terraform Format Check
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform fmt -check
      
      - name: Terraform Validate
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform validate
      
      - name: Terraform Plan
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          # Try plan, if it fails due to lock, wait a bit and retry
          terraform plan -out=tfplan || {
            echo "⚠️  Plan failed, checking if it's a lock issue..."
            sleep 30
            echo "Retrying plan..."
            terraform plan -out=tfplan
          }
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}/tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [determine-environment, terraform-plan]
    timeout-minutes: 60
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    if: |
      (github.ref == 'refs/heads/develop') ||
      (github.ref == 'refs/heads/main' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      # Production requires manual approval (configure in GitHub Settings → Environments)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify OIDC Configuration
        run: |
          echo "🔍 OIDC Configuration Check:"
          echo "Role ARN: ${{ needs.determine-environment.outputs.role_arn }}"
          echo "Repository: ${{ github.repository }}"
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}
      
      - name: Terraform Apply
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform apply -auto-approve tfplan
      
      - name: Terraform Output
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform output -json > terraform-outputs.json
        continue-on-error: true
      
      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}/terraform-outputs.json
          retention-days: 30
        continue-on-error: true

  terraform-unlock:
    name: Force Unlock Terraform State
    runs-on: ubuntu-latest
    needs: determine-environment
    if: github.event.inputs.action == 'unlock'
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Unlock-${{ github.run_id }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init -lock=false
        continue-on-error: true
      
      - name: List current locks
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          echo "🔍 Checking for Terraform state locks..."
          echo ""
          echo "To find the lock ID, check the error message from the failed operation."
          echo "The lock ID is usually shown in the error output."
          echo ""
          echo "Example lock ID format: d8e7f752-3c50-86d6-e50c-9d7c21c1a40c"
        continue-on-error: true
      
      - name: Force unlock state
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          LOCK_ID="${{ github.event.inputs.lock_id }}"
          
          if [ -z "${LOCK_ID}" ]; then
            echo "❌ Lock ID not provided!"
            echo ""
            echo "Please provide the lock ID from the error message."
            echo "Example: d8e7f752-3c50-86d6-e50c-9d7c21c1a40c"
            echo ""
            echo "You can also unlock via AWS Console:"
            echo "1. Go to DynamoDB → devops-deployment-terraform-lock"
            echo "2. Find item with LockID matching your state file path"
            echo "3. Delete that item"
            exit 1
          fi
          
          echo "🔓 Force unlocking state with Lock ID: ${LOCK_ID}"
          terraform force-unlock -force ${LOCK_ID}
          echo "✅ State unlocked successfully!"
          echo ""
          echo "You can now retry your Terraform operation."

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: determine-environment
    if: github.event.inputs.action == 'destroy'
    timeout-minutes: 60
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}-destroy
      # Add approval requirement in GitHub Settings → Environments
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          # Try init, if locked wait and retry
          terraform init || {
            echo "⚠️  Init failed, may be due to state lock. Waiting 30 seconds..."
            sleep 30
            terraform init
          }
      
      - name: Get EKS cluster name
        id: get-cluster
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "devops-deployment-${{ needs.determine-environment.outputs.environment }}")
          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "EKS Cluster: ${CLUSTER_NAME}"
        continue-on-error: true
      
      - name: Install kubectl
        if: steps.get-cluster.outcome == 'success'
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Configure kubectl for EKS
        if: steps.get-cluster.outcome == 'success'
        run: |
          aws eks update-kubeconfig \
            --name ${{ steps.get-cluster.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }}
      
      - name: Delete Kubernetes resources (if cluster exists)
        if: steps.get-cluster.outcome == 'success'
        run: |
          echo "🧹 Cleaning up Kubernetes resources before infrastructure destruction..."
          
          # Try to delete all resources in bloghub namespace
          if kubectl get namespace bloghub 2>/dev/null; then
            echo "Deleting all resources in bloghub namespace..."
            
            # Delete Load Balancer services first (they take longest)
            echo "Deleting Load Balancer services..."
            kubectl get svc -n bloghub -o json 2>/dev/null | jq -r '.items[] | select(.spec.type=="LoadBalancer") | .metadata.name' | while read svc; do
              echo "  Deleting LoadBalancer service: $svc"
              kubectl delete svc "$svc" -n bloghub --ignore-not-found=true || true
            done || true
            
            # Delete all other resources
            kubectl delete all --all -n bloghub --ignore-not-found=true || true
            kubectl delete configmap --all -n bloghub --ignore-not-found=true || true
            kubectl delete secret --all -n bloghub --ignore-not-found=true || true
            kubectl delete ingress --all -n bloghub --ignore-not-found=true || true
            
            # Wait for Load Balancers to be deleted (they take 2-3 minutes)
            echo "Waiting for Load Balancers to be deleted (this may take 2-3 minutes)..."
            TIMEOUT=240
            ELAPSED=0
            while [ ${ELAPSED} -lt ${TIMEOUT} ]; do
              LB_COUNT=$(kubectl get svc -n bloghub -o json 2>/dev/null | jq -r '.items[] | select(.spec.type=="LoadBalancer") | .metadata.name' | wc -l | tr -d ' ' || echo "0")
              if [ "${LB_COUNT}" == "0" ] || [ -z "${LB_COUNT}" ]; then
                echo "✅ All Load Balancer services deleted from Kubernetes"
                break
              fi
              echo "   Still waiting for Load Balancers... (${ELAPSED}s elapsed, ${LB_COUNT} remaining)"
              sleep 15
              ELAPSED=$((ELAPSED + 15))
            done
            
            # Wait additional time for AWS to clean up Load Balancer resources
            echo "Waiting for AWS to clean up Load Balancer resources (30 seconds)..."
            sleep 30
            
            # Delete namespace
            kubectl delete namespace bloghub --ignore-not-found=true --wait=true || true
          else
            echo "⚠️ bloghub namespace not found, skipping cleanup"
          fi
          
          # Also try to delete any remaining resources cluster-wide
          echo "Checking for any remaining workloads..."
          kubectl get deployments --all-namespaces 2>/dev/null | grep -v "kube-system" || echo "No deployments found"
          kubectl get services --all-namespaces 2>/dev/null | grep -v "kube-system" || echo "No services found"
        continue-on-error: true
      
      - name: Force unlock Terraform state (if locked)
        run: |
          echo "🔓 Checking for Terraform state locks..."
          TERRAFORM_DIR="${{ needs.determine-environment.outputs.terraform_dir }}"
          
          # Try to unlock if there's a stale lock
          cd ${TERRAFORM_DIR}
          terraform force-unlock -force $(echo "d8e7f752-3c50-86d6-e50c-9d7c21c1a40c" 2>/dev/null || echo "") 2>/dev/null || true
          
          echo "✅ State lock check complete"
        continue-on-error: true
      
      - name: Wait before destroy (ensure Load Balancers are gone)
        run: |
          echo "⏳ Waiting additional time to ensure AWS resources are cleaned up..."
          sleep 60
          echo "✅ Ready to proceed with destroy"
      
      - name: Terraform Destroy
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          echo "🗑️  Starting Terraform destroy..."
          terraform destroy -auto-approve || {
            echo "⚠️  Destroy failed, checking for state lock..."
            # If destroy fails due to lock, try to unlock
            terraform force-unlock -force $(terraform show -json 2>/dev/null | jq -r '.values.root_module.resources[].values.id' 2>/dev/null | head -1) 2>/dev/null || true
            echo "Retrying destroy..."
            terraform destroy -auto-approve
          }
