name: Infrastructure Deployment

# Concurrency control - prevents multiple runs
concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

# Permissions for OIDC authentication
permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required for checkout

on:
  # Trigger on push to develop (staging) or main (production) branches
  push:
    branches:
      - develop  # → staging environment
      - main     # → production environment
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infrastructure.yml'
  
  # Trigger on pull requests for review
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infrastructure.yml'
  
  # Allow manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TERRAFORM_VERSION: 1.6.0

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      terraform_dir: ${{ steps.set-env.outputs.terraform_dir }}
    steps:
      - name: Set environment based on branch or input
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
          else
            ENV="staging"
          fi
          
          ROLE_ARN="arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role"
          
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "terraform_dir=infra/terraform/environments/${ENV}" >> $GITHUB_OUTPUT
          
          echo "✅ Role ARN will be: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role"
          
          echo "✅ Deploying to: ${ENV}"
          echo "📁 Terraform directory: infra/terraform/environments/${ENV}"
          echo "🔐 IAM Role ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role"
          echo "📦 Repository: ${{ github.repository }}"
          echo ""
          echo "⚠️ OIDC Trust Policy should match: repo:${{ github.repository }}:*"

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: determine-environment
    timeout-minutes: 30
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
          role-duration-seconds: 3600
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init
      
      - name: Check and force-unlock stale state lock
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          echo "🔍 Checking for state lock..."
          if terraform force-unlock -force $(terraform show -json 2>/dev/null | jq -r '.values.root_module.resources[] | select(.type == "aws_dynamodb_table") | .values.name' 2>/dev/null || echo "") 2>&1 | grep -q "No locks found"; then
            echo "✅ No locks found"
          else
            echo "⚠️ Attempting to force-unlock any stale locks..."
            # Try to get lock ID from error or force-unlock all
            terraform force-unlock -force $(terraform show -json 2>/dev/null | jq -r '.values.root_module.resources[] | select(.type == "aws_dynamodb_table") | .values.name' 2>/dev/null || echo "") || true
          fi
        continue-on-error: true
      
      - name: Terraform Format Check
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform fmt -check
      
      - name: Terraform Validate
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform validate
      
      - name: Terraform Plan
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          # Try plan, if it fails due to lock, force-unlock and retry
          if ! terraform plan -out=tfplan 2>&1 | tee plan-output.log; then
            if grep -q "Error acquiring the state lock" plan-output.log; then
              echo "⚠️ Plan failed due to lock, attempting to force-unlock..."
              LOCK_ID=$(grep -oP 'ID:\s+\K[^\s]+' plan-output.log | head -1 || echo "")
              if [ -n "${LOCK_ID}" ]; then
                echo "Force-unlocking: ${LOCK_ID}"
                terraform force-unlock -force "${LOCK_ID}" || true
                echo "Retrying plan..."
                terraform plan -out=tfplan
              else
                echo "Could not extract lock ID, trying to force-unlock all..."
                terraform force-unlock -force - || true
                terraform plan -out=tfplan
              fi
            else
              exit 1
            fi
          fi
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}/tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [determine-environment, terraform-plan]
    timeout-minutes: 60
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    if: |
      (github.ref == 'refs/heads/develop') ||
      (github.ref == 'refs/heads/main' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      # Production requires manual approval (configure in GitHub Settings → Environments)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify OIDC Configuration
        run: |
          echo "🔍 OIDC Configuration Check:"
          echo "Role ARN: ${{ needs.determine-environment.outputs.role_arn }}"
          echo "Repository: ${{ github.repository }}"
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}
      
      - name: Terraform Apply
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          # Try apply, if it fails due to lock, force-unlock and retry
          if ! terraform apply -auto-approve tfplan 2>&1 | tee apply-output.log; then
            if grep -q "Error acquiring the state lock" apply-output.log; then
              echo "⚠️ Apply failed due to lock, attempting to force-unlock..."
              LOCK_ID=$(grep -oP 'ID:\s+\K[^\s]+' apply-output.log | head -1 || echo "")
              if [ -n "${LOCK_ID}" ]; then
                echo "Force-unlocking: ${LOCK_ID}"
                terraform force-unlock -force "${LOCK_ID}" || true
                echo "Retrying apply..."
                terraform apply -auto-approve tfplan
              else
                exit 1
              fi
            else
              exit 1
            fi
          fi
      
      - name: Terraform Output
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform output -json > terraform-outputs.json
        continue-on-error: true
      
      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}/terraform-outputs.json
          retention-days: 30
        continue-on-error: true

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: determine-environment
    if: github.event.inputs.action == 'destroy'
    timeout-minutes: 60
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}-destroy
      # Add approval requirement in GitHub Settings → Environments
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init
      
      - name: Get EKS cluster name
        id: get-cluster
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "devops-deployment-${{ needs.determine-environment.outputs.environment }}")
          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "EKS Cluster: ${CLUSTER_NAME}"
        continue-on-error: true
      
      - name: Install kubectl
        if: steps.get-cluster.outcome == 'success'
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Configure kubectl for EKS
        if: steps.get-cluster.outcome == 'success'
        run: |
          aws eks update-kubeconfig \
            --name ${{ steps.get-cluster.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }}
      
      - name: Delete Kubernetes resources (if cluster exists)
        if: steps.get-cluster.outcome == 'success'
        run: |
          echo "🧹 Cleaning up Kubernetes resources before infrastructure destruction..."
          
          # Try to delete all resources in bloghub namespace
          if kubectl get namespace bloghub 2>/dev/null; then
            echo "Deleting all resources in bloghub namespace..."
            kubectl delete all --all -n bloghub --ignore-not-found=true || true
            kubectl delete configmap --all -n bloghub --ignore-not-found=true || true
            kubectl delete secret --all -n bloghub --ignore-not-found=true || true
            kubectl delete ingress --all -n bloghub --ignore-not-found=true || true
            
            # Wait a bit for resources to terminate
            echo "Waiting for resources to terminate..."
            sleep 10
            
            # Delete namespace
            kubectl delete namespace bloghub --ignore-not-found=true || true
          else
            echo "⚠️ bloghub namespace not found, skipping cleanup"
          fi
          
          # Also try to delete any remaining resources cluster-wide
          echo "Checking for any remaining workloads..."
          kubectl get deployments --all-namespaces 2>/dev/null | grep -v "kube-system" || echo "No deployments found"
          kubectl get services --all-namespaces 2>/dev/null | grep -v "kube-system" || echo "No services found"
        continue-on-error: true
      
      - name: Check and force-unlock stale state lock before destroy
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          echo "🔍 Checking for state lock before destroy..."
          # Try to force-unlock any existing locks
          terraform force-unlock -force - 2>&1 | head -20 || true
        continue-on-error: true
      
      - name: Terraform Destroy
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: |
          # Try destroy, if it fails due to lock, force-unlock and retry
          if ! terraform destroy -auto-approve 2>&1 | tee destroy-output.log; then
            if grep -q "Error acquiring the state lock" destroy-output.log; then
              echo "⚠️ Destroy failed due to lock, attempting to force-unlock..."
              LOCK_ID=$(grep -oP 'ID:\s+\K[^\s]+' destroy-output.log | head -1 || echo "")
              if [ -n "${LOCK_ID}" ]; then
                echo "Force-unlocking: ${LOCK_ID}"
                terraform force-unlock -force "${LOCK_ID}" || true
                echo "Retrying destroy..."
                terraform destroy -auto-approve
              else
                # Try to unlock with the ID from the error message
                LOCK_ID=$(grep -oP 'ID:\s+\K[^\w-]+' destroy-output.log | tr -d ' ' | head -1 || echo "")
                if [ -n "${LOCK_ID}" ]; then
                  terraform force-unlock -force "${LOCK_ID}" || true
                  terraform destroy -auto-approve
                else
                  exit 1
                fi
              fi
            else
              exit 1
            fi
          fi
