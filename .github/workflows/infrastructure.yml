name: Infrastructure Deployment

# Concurrency control - prevents multiple runs
concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

# Permissions for OIDC authentication
permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required for checkout

on:
  # Trigger on push to develop (staging) or main (production) branches
  push:
    branches:
      - develop  # → staging environment
      - main     # → production environment
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infrastructure.yml'
  
  # Trigger on pull requests for review
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infrastructure.yml'
  
  # Allow manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TERRAFORM_VERSION: 1.6.0

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      terraform_dir: ${{ steps.set-env.outputs.terraform_dir }}
      role_arn: ${{ steps.set-env.outputs.role_arn }}
    steps:
      - name: Set environment based on branch or input
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
          else
            ENV="staging"
          fi
          
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "terraform_dir=infra/terraform/environments/${ENV}" >> $GITHUB_OUTPUT
          echo "role_arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role" >> $GITHUB_OUTPUT
          
          echo "✅ Deploying to: ${ENV}"
          echo "📁 Terraform directory: infra/terraform/environments/${ENV}"
          echo "🔐 IAM Role ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-role"
          echo "📦 Repository: ${{ github.repository }}"
          echo ""
          echo "⚠️ OIDC Trust Policy should match: repo:${{ github.repository }}:*"

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: determine-environment
    timeout-minutes: 30
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify OIDC Configuration
        run: |
          echo "🔍 OIDC Configuration Check:"
          echo "Role ARN: ${{ needs.determine-environment.outputs.role_arn }}"
          echo "AWS Region: ${{ env.AWS_REGION }}"
          echo "AWS Account ID: ${{ secrets.AWS_ACCOUNT_ID }}"
          echo "Repository: ${{ github.repository }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Expected Trust Policy: repo:${{ github.repository }}:*"
          echo ""
          echo "📋 Verification Checklist:"
          echo "1. IAM Role exists: dev-github-actions-role"
          echo "2. OIDC Provider ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:oidc-provider/token.actions.githubusercontent.com"
          echo "3. Trust policy Principal MUST be: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:oidc-provider/token.actions.githubusercontent.com"
          echo "4. Trust policy condition: repo:${{ github.repository }}:*"
          echo "5. Workflow has id-token: write permission"
          echo ""
          echo "🔑 Testing OIDC token availability..."
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✅ OIDC token environment variables are set"
            echo "   ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:0:20}..."
            echo "   ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          else
            echo "❌ OIDC token environment variables are NOT set"
            echo "   ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NOT SET}"
            echo "   ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-NOT SET}"
            echo "⚠️ This indicates a permissions issue - check that id-token: write is set"
          fi
          echo ""
          echo "🔍 Additional Debug Info:"
          echo "   GitHub Event: ${{ github.event_name }}"
          echo "   GitHub Ref: ${{ github.ref }}"
          echo "   GitHub Actor: ${{ github.actor }}"
          echo "   Is Fork: ${{ github.event.repository.fork }}"
      
      - name: Get OIDC Token (for debugging)
        id: oidc-token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            console.log('✅ OIDC token retrieved successfully');
            console.log('Token length:', token.length);
            console.log('Token preview:', token.substring(0, 50) + '...');
            core.setOutput('token', token);
        continue-on-error: true
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.determine-environment.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
          role-duration-seconds: 3600
          audience: sts.amazonaws.com
          mask-aws-account-id: false
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init
      
      - name: Terraform Format Check
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform fmt -check
      
      - name: Terraform Validate
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform validate
      
      - name: Terraform Plan
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform plan -out=tfplan
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}/tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [determine-environment, terraform-plan]
    timeout-minutes: 60
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    if: |
      (github.ref == 'refs/heads/develop') ||
      (github.ref == 'refs/heads/main' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      # Production requires manual approval (configure in GitHub Settings → Environments)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify OIDC Configuration
        run: |
          echo "🔍 OIDC Configuration Check:"
          echo "Role ARN: ${{ needs.determine-environment.outputs.role_arn }}"
          echo "Repository: ${{ github.repository }}"
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.determine-environment.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}
      
      - name: Terraform Apply
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform apply -auto-approve tfplan
      
      - name: Terraform Output
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform output -json > terraform-outputs.json
        continue-on-error: true
      
      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.determine-environment.outputs.environment }}
          path: ${{ needs.determine-environment.outputs.terraform_dir }}/terraform-outputs.json
          retention-days: 30
        continue-on-error: true

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: determine-environment
    if: github.event.inputs.action == 'destroy'
    timeout-minutes: 60
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read     # Required for checkout
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}-destroy
      # Add approval requirement in GitHub Settings → Environments
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify OIDC Configuration
        run: |
          echo "🔍 OIDC Configuration Check:"
          echo "Role ARN: ${{ needs.determine-environment.outputs.role_arn }}"
          echo "AWS Region: ${{ env.AWS_REGION }}"
          echo "Repository: ${{ github.repository }}"
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.determine-environment.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform init
      
      - name: Terraform Destroy
        working-directory: ${{ needs.determine-environment.outputs.terraform_dir }}
        run: terraform destroy -auto-approve
