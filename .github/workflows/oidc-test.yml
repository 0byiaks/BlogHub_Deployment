name: OIDC Test

# Permissions for OIDC authentication
permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required for checkout

on:
  # Trigger on push to OIDC-test branch
  push:
    branches:
      - OIDC-test
  
  # Allow manual trigger
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::716769866080:role/dev-github-actions-role

jobs:
  test-oidc:
    name: Test OIDC Authentication
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Test OIDC Authentication
        run: |
          echo "🔍 Testing OIDC Authentication..."
          echo ""
          
          # Get current identity
          echo "Current AWS Identity:"
          aws sts get-caller-identity
          echo ""
          
          # Verify we're using the correct role
          ROLE_NAME=$(aws sts get-caller-identity --query Arn --output text | cut -d'/' -f2)
          
          if [[ "$ROLE_NAME" == "dev-github-actions-role" ]]; then
            echo "✅ OIDC Authentication Successful!"
            echo "✅ Using IAM Role: $ROLE_NAME"
            echo ""
            echo "🎉 OIDC is working correctly!"
          else
            echo "❌ Unexpected role: $ROLE_NAME"
            exit 1
          fi
