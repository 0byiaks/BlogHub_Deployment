apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
  namespace: bloghub
  labels:
    app: post-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
        tier: backend
    spec:
      containers:
      - name: post-service
        image: 716769866080.dkr.ecr.eu-north-1.amazonaws.com/dev-bloghub:post-service-latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5